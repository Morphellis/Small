  <script>
    /* тема до отрисовки, чтобы не мигало: сохранённый выбор, иначе как в системе */
    (function () {
      var t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      try { var v = localStorage.getItem("trainer-theme"); if (v === "light" || v === "dark") t = v; } catch (e) {}
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
