<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>СМОЛ</title>
  <meta name="description" content="Тренажёр тестов СМОЛ (Мини-Мульт, 71 вопрос) и СМИЛ (566 утверждений): шкалы и профиль пересчитываются после каждого ответа.">
  <link rel="stylesheet" href="styles.css?v=19">
</head>
<body>
  <section class="panel" id="panel" aria-label="Баллы">
    <div class="wrap">
      <div class="panel-body" id="panelBody">
        <aside class="side">
          <div class="test-switch" role="tablist" aria-label="Тест">
            <button type="button" role="tab" data-test="smol" title="Мини-Мульт"><b>СМОЛ</b><small>71 вопрос</small></button>
            <button type="button" role="tab" data-test="smil" title="Л. Н. Собчик"><b>СМИЛ</b><small>566 утверждений</small></button>
          </div>
          <div class="side-tools">
            <button type="button" class="btn btn-key" id="keyBtn" aria-pressed="false"><span class="long">Посмотреть правильные ответы</span><span class="short">Ключ</span></button>
            <button type="button" class="btn btn-ghost" id="toggleChart" aria-pressed="true">Профиль</button>
            <button type="button" class="btn btn-ghost" id="toggleTable" aria-pressed="true">Таблица</button>
          </div>
          <div class="hint" id="hint"><b>Клавиши</b><span><kbd>1</kbd> Да</span><span><kbd>2</kbd> Нет</span><span><kbd>3</kbd> Не знаю</span><span><kbd>0</kbd> снять ответ</span><span><kbd>↑</kbd><kbd>↓</kbd> вопрос</span></div>
        </aside>
        <div class="chart-wrap" id="chartWrap">
          <div class="view-switch" role="tablist" aria-label="Вид профиля">
            <button type="button" role="tab" data-view="bars">Шкалы</button>
            <button type="button" role="tab" data-view="chart">График</button>
          </div>
          <div class="bars" id="bars"></div>
          <svg id="chart" viewBox="0 0 600 290" role="img" aria-label="Профиль Т-баллов"></svg>
        </div>
        <div class="table-wrap" id="tableWrap">
          <table class="scores" id="scoreTable">
            <thead>
              <tr><th class="num">Т-баллы</th><th class="num">Сырые</th><th>Шкалы</th><th class="num" title="Изменение Т после последнего ответа">Δ Т</th></tr>
            </thead>
            <tbody id="scoreBody"></tbody>
          </table>
        </div>
        <div class="strip" id="strip" hidden></div>
        <div class="panel-foot">
          <details class="validity" id="validity"><summary id="validitySum"></summary><div class="validity-body" id="validityBody"></div></details>
          <button type="button" class="btn btn-reset" id="resetBtn"><span class="long">Сбросить результаты</span><span class="short">Сброс</span></button>
          <span class="toast" id="toast" role="status" aria-live="polite"></span>
        </div>
      </div>
    </div>
  </section>

  <main class="wrap">
    <ol class="questions" id="questions"></ol>

    <section class="sheet" aria-labelledby="sheetTitle">
      <h2 id="sheetTitle">Регистрационный лист</h2>
      <div class="sheet-scroll"><div class="sheet-grid" id="sheetGrid"></div></div>
      <ul class="legend">
        <li><span class="cell st-empty"></span>нет ответа</li>
        <li><span class="cell st-first a-Y">Д</span><span class="cell st-first a-N">Н</span>«Да» или «Нет» с первого раза</li>
        <li><span class="cell st-changed a-N">Н</span>ответ менялся (Да ↔ Нет или после «Не знаю»)</li>
        <li><span class="cell st-dk a-dk">?</span>«Не знаю»</li>
        <li><span class="cell st-dkAfter a-dk">?</span>сначала «Да»/«Нет», затем «Не знаю»</li>
      </ul>
    </section>

  </main>

  <script src="data.js?v=19"></script>
  <script src="scoring.js?v=19"></script>
  <script src="hints.js?v=19"></script>
  <script src="smil-data.js?v=19"></script>
  <script src="smil-scoring.js?v=19"></script>
  <script src="smil-hints.js?v=19"></script>
  <script src="app.js?v=19"></script>
</body>
</html>
