# Проверка веток и pull request'ов: типы, тесты, сборка и сценарии в браузере. Ничего не выкладывает.
name: Check

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Критические сценарии в настоящем Chrome (он уже есть на ubuntu-latest) на телефоне и компьютере.
      - run: npm run e2e
        env:
          E2E_ONLY: "320,390,1440"
